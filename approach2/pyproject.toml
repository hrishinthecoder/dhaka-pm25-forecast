[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaka-pm25-forecast"
version = "0.1.0"
description = "Next-day PM2.5 forecasting for Dhaka (ERA5 reanalysis + satellite anchors + calendar proxies)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
